name: Deploy static demo to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static demo artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/dashboard
          cp dashboard/index.html _site/dashboard/
          cp dashboard/demo.html _site/dashboard/
          cp dashboard/app.js _site/dashboard/
          cp dashboard/config.js _site/dashboard/
          cp dashboard/map_utils.js _site/dashboard/
          cp dashboard/styles.css _site/dashboard/
          cp dashboard/favicon.svg _site/dashboard/
          cp -r dashboard/data _site/dashboard/data
          cp -r dashboard/demo-data _site/dashboard/demo-data
          cp index.html _site/
          cp LICENSE THIRD_PARTY_NOTICES.md _site/
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
